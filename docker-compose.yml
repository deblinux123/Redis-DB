services:
  redis:
    image: redis/redis-stack:latest
    container_name: redis-stack

    restart: unless-stopped

    ports:
      - "127.0.0.1:6380:6379"

    volumes:
      - redis_data:/data
      - ./redis/redis-stack.conf:/redis-stack.conf:ro

volumes:
  redis_data:
    name: redis_data
    external: true
